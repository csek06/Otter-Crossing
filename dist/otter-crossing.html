/* Otter Crossing. Colors and type are variables so brand values can be swapped in one place. */

:root {
  /* Seven named colors. The game art reads these too. */
  --c-paper: #F3EEE4;
  --c-ink: #2A211C;
  --c-brand: #1D25E2; /* REVIEW: the blue used for links on otter.ai. Confirm with brand. */
  --c-teal: #0F2F37;
  --c-highlighter: #FFE14D;
  --c-red: #E5484D;
  --c-water: #1F5FA8; /* the river */

  --c-paper-dark: color-mix(in srgb, var(--c-paper) 90%, var(--c-ink));
  --c-ink-soft: color-mix(in srgb, var(--c-ink) 70%, var(--c-paper));

  --f-display: "Overpass", system-ui, sans-serif;
  --f-mono: "Overpass Mono", ui-monospace, Menlo, Consolas, monospace;
  --f-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --stage-w: 360px;
  --u: calc(var(--stage-w) / 100); /* 1% of stage width */
  --edge: 3px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--c-ink);
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

body {
  display: grid;
  place-items: center;
  font-family: var(--f-ui);
  color: var(--c-ink);
}

.stage {
  position: relative;
  overflow: hidden;
  background: var(--c-ink);
}

canvas {
  display: block;
  touch-action: none;
}

[hidden] { display: none !important; }

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* Buttons: flat paper plates with a hard ink edge, like the blocks in the game. */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  min-width: 48px;
  padding: 0 calc(var(--u) * 4);
  font: 700 max(16px, calc(var(--u) * 4.6)) / 1 var(--f-ui);
  color: var(--c-ink);
  background: var(--c-paper);
  border: 2px solid var(--c-ink);
  border-radius: 6px;
  box-shadow: 0 var(--edge) 0 var(--c-ink);
  text-decoration: none;
  cursor: pointer;
  transition: transform 60ms ease-out, box-shadow 60ms ease-out;
}
.btn:active {
  transform: translateY(var(--edge));
  box-shadow: 0 0 0 var(--c-ink);
}
.btn:focus-visible,
.hud-pause:focus-visible,
.debug input:focus-visible {
  outline: 3px solid var(--c-brand);
  outline-offset: 3px;
}
.btn-primary {
  background: var(--c-brand);
  color: var(--c-paper);
  font-family: var(--f-display);
  font-weight: 800;
  font-size: max(20px, calc(var(--u) * 6));
  min-height: max(56px, calc(var(--u) * 15));
}
.btn-quiet {
  background: transparent;
  border-color: transparent;
  box-shadow: none;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.btn-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: calc(var(--u) * 3);
}

/* Screens sit over the live scene. Content lives in a paper drawer at the bottom. */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}

.drawer {
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 3.2);
  padding: calc(var(--u) * 6) calc(var(--u) * 6) calc(var(--u) * 8);
  background: var(--c-paper);
  border-top: 3px solid var(--c-ink);
}

.drawer-heading {
  margin: 0;
  font: 800 calc(var(--u) * 8) / 1.05 var(--f-display);
}

/* Title: a road sign on two posts. */
.screen-title {
  justify-content: space-between;
}
.logo-slot {
  align-self: center;
  margin-top: calc(var(--u) * 8);
  width: calc(var(--u) * 34);
  height: calc(var(--u) * 10);
  border: 2px dashed var(--c-paper-dark);
  border-radius: 4px;
  opacity: 0.6;
}
/* With a logo in it, the slot becomes a small paper plaque so it reads over the scene. */
.logo-slot:not(:empty) {
  width: auto;
  height: auto;
  padding: calc(var(--u) * 2.4) calc(var(--u) * 4.5);
  background: var(--c-paper);
  border: 3px solid var(--c-ink);
  border-radius: 6px;
  opacity: 1;
}
.logo-slot svg { display: block; width: calc(var(--u) * 20); height: auto; color: var(--c-ink); }

.sign {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.sign-plate {
  margin: 0;
  padding: calc(var(--u) * 4) calc(var(--u) * 7) calc(var(--u) * 3);
  background: var(--c-brand);
  color: var(--c-paper);
  border: 3px solid var(--c-ink);
  border-radius: 10px;
  box-shadow: inset 0 0 0 calc(var(--u) * 1.2) var(--c-brand), inset 0 0 0 calc(var(--u) * 1.8) var(--c-paper);
  font: 800 calc(var(--u) * 12.5) / 0.95 var(--f-display);
  letter-spacing: -0.01em;
  text-align: center;
  max-width: calc(var(--u) * 86);
}
.sign-tag {
  margin: calc(var(--u) * -0.6) 0 0;
  padding: calc(var(--u) * 1.4) calc(var(--u) * 4) calc(var(--u) * 1);
  background: var(--c-paper);
  color: var(--c-ink);
  border: 3px solid var(--c-ink);
  border-radius: 6px;
  font: 600 calc(var(--u) * 3.8) / 1.2 var(--f-mono);
}
.sign-posts {
  display: flex;
  gap: calc(var(--u) * 30);
  height: calc(var(--u) * 12);
}
.sign-posts span {
  width: calc(var(--u) * 2.4);
  background: var(--c-ink-soft);
  border: 2px solid var(--c-ink);
  border-top: 0;
}

/* HUD */
.hud {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: space-between;
  gap: calc(var(--u) * 2);
  padding: calc(var(--u) * 3) calc(var(--u) * 3);
  pointer-events: none;
}
.hud > * { pointer-events: auto; }
.hud-score, .hud-items {
  display: flex;
  align-items: baseline;
  gap: calc(var(--u) * 1.5);
  padding: calc(var(--u) * 1.2) calc(var(--u) * 3) calc(var(--u) * 0.6);
  background: var(--c-paper);
  border: 2px solid var(--c-ink);
  border-radius: 6px;
}
.hud-num {
  font: 800 calc(var(--u) * 7) / 1 var(--f-display);
  font-variant-numeric: tabular-nums;
}
.hud-label {
  font: 600 calc(var(--u) * 3.4) / 1 var(--f-mono);
  color: var(--c-ink-soft);
}
.hud-items { align-items: center; margin-right: auto; }
.hud-check {
  width: calc(var(--u) * 5);
  height: calc(var(--u) * 5);
  fill: none;
  stroke: var(--c-ink);
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.hud-check path { stroke: var(--c-brand); stroke-width: 2.6; }
.hud-pause {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  background: var(--c-paper);
  border: 2px solid var(--c-ink);
  border-radius: 6px;
  cursor: pointer;
}
.hud-pause svg { width: 20px; height: 20px; fill: var(--c-ink); }

/* One-line hints. Plain ink chip, no animation beyond a fade. */
.toast {
  position: absolute;
  left: 50%;
  top: calc(var(--u) * 28);
  transform: translateX(-50%);
  width: max-content;
  max-width: calc(var(--u) * 92);
  padding: calc(var(--u) * 2.2) calc(var(--u) * 4) calc(var(--u) * 1.6);
  background: var(--c-ink);
  color: var(--c-paper);
  border-radius: 6px;
  font: 800 calc(var(--u) * 4.2) / 1.2 var(--f-display);
  text-align: center;
  text-wrap: balance;
  opacity: 0;
  transition: opacity 160ms ease-out;
  pointer-events: none;
}
.toast.show { opacity: 1; }

/* How to play */
.howto-list {
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: calc(var(--u) * 2.6);
  font: 400 max(15px, calc(var(--u) * 4.3)) / 1.4 var(--f-ui);
}
.howto-list li {
  padding-left: calc(var(--u) * 6);
  position: relative;
}
.howto-list li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0.3em;
  width: calc(var(--u) * 3);
  height: calc(var(--u) * 3);
  border: 2px solid var(--c-ink);
  border-radius: 3px;
}

/* Game over */
.over-cause {
  margin: 0;
  font: 800 calc(var(--u) * 9) / 1 var(--f-display);
}
.over-tip {
  margin: 0;
  font: 400 max(16px, calc(var(--u) * 4.6)) / 1.4 var(--f-ui);
}
.over-stats {
  display: flex;
  gap: calc(var(--u) * 8);
  margin: calc(var(--u) * 1) 0 0;
  padding-top: calc(var(--u) * 3);
  border-top: 2px solid var(--c-paper-dark);
}
.over-stats dt {
  font: 600 calc(var(--u) * 3.4) / 1 var(--f-mono);
  color: var(--c-ink-soft);
}
.over-stats dd {
  margin: calc(var(--u) * 1) 0 0;
  font: 800 calc(var(--u) * 10) / 1 var(--f-display);
  font-variant-numeric: tabular-nums;
}
.over-newbest {
  margin: 0;
  font: 600 calc(var(--u) * 3.8) / 1 var(--f-mono);
  color: var(--c-brand);
}

/* Debug panel (?debug=1) */
.debug {
  position: absolute;
  right: 6px;
  bottom: 6px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 6px 8px;
  background: var(--c-ink);
  color: var(--c-paper);
  font: 12px var(--f-mono);
  border-radius: 4px;
}
.debug label { display: flex; align-items: center; gap: 6px; min-height: 24px; }

/* Title row: two text buttons and the sound icon. */
.btn-row-3 { grid-template-columns: 1fr 1fr auto; }
.btn-icon { padding: 0; width: 52px; }
.icon-sound { width: 26px; height: 26px; fill: none; stroke: var(--c-ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-sound path:first-child { fill: var(--c-ink); }
.icon-sound .cross { display: none; }
.btn-mute.is-muted .icon-sound .wave { display: none; }
.btn-mute.is-muted .icon-sound .cross { display: inline; }
.icon-music { width: 26px; height: 26px; fill: none; stroke: var(--c-ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-music .head { fill: var(--c-ink); }
.icon-music .slash { display: none; }
.btn-music.is-off .icon-music .slash { display: inline; }
.btn-music.is-off .icon-music .stem, .btn-music.is-off .icon-music .head { opacity: 0.45; }

/* Long screens scroll inside the drawer. */
.drawer-full {
  max-height: 100%;
  overflow-y: auto;
  overscroll-behavior: contain;
  touch-action: pan-y;
  gap: calc(var(--u) * 3);
  padding-top: calc(var(--u) * 7);
}

/* HUD power-up tracker: a second row under the score with one slot per power-up
   this run can spawn. Faded and dashed until found, a draining ring while active,
   a full ink ring while held, crossed out once a once-a-run power-up is spent. */
.hud-powers {
  order: 2;
  flex: 1 0 100%;
  display: flex;
  gap: calc(var(--u) * 1.6);
}
.hud-power {
  position: relative;
  width: calc(var(--u) * 9);
  height: calc(var(--u) * 9);
  min-width: 32px;
  min-height: 32px;
  display: grid;
  place-items: center;
  background: var(--c-paper);
  border: 2px solid var(--c-ink);
  border-radius: 50%;
}
.hud-power .ring { position: absolute; inset: -2px; width: calc(100% + 4px); height: calc(100% + 4px); transform: rotate(-90deg); }
.hud-power .ring-bg { fill: none; stroke: var(--c-paper-dark); stroke-width: 4; }
.hud-power .ring-fg { fill: none; stroke: var(--c-brand); stroke-width: 4; stroke-linecap: round; }
.hud-power.is-off, .hud-power.is-used { border-style: dashed; border-color: var(--c-ink-soft); }
.hud-power.is-off .ring, .hud-power.is-used .ring { display: none; }
.hud-power.is-off .hud-power-icon { color: var(--c-ink-soft); opacity: 0.6; }
.hud-power.is-used .hud-power-icon { color: var(--c-ink-soft); opacity: 0.35; }
.hud-power.is-used::after {
  content: '';
  position: absolute;
  left: 12%; right: 12%; top: 50%;
  height: 2px;
  background: var(--c-ink-soft);
  transform: rotate(-45deg);
}
.hud-power.is-active { background: var(--c-paper); }
.hud-power.is-held .ring-fg { stroke: var(--c-ink); }
.hud-power-icon, .recap-icon svg, .ft-icon svg {
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.hud-power-icon { position: relative; width: 55%; height: 55%; color: var(--c-ink); }

/* Feature card on pickup: sits low so the lanes ahead stay clear. */
.feature-toast {
  position: absolute;
  left: 50%;
  bottom: calc(var(--u) * 5);
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: calc(var(--u) * 3);
  width: max-content;
  max-width: calc(var(--u) * 92);
  padding: calc(var(--u) * 2.6) calc(var(--u) * 4) calc(var(--u) * 2.6) calc(var(--u) * 3);
  background: var(--c-brand);
  color: var(--c-paper);
  border: 2px solid var(--c-ink);
  border-radius: 8px;
  box-shadow: 0 var(--edge) 0 var(--c-ink);
  opacity: 0;
  transition: opacity 140ms ease-out;
  pointer-events: none;
}
.feature-toast.show { opacity: 1; }
.ft-icon {
  flex: none;
  width: calc(var(--u) * 10);
  height: calc(var(--u) * 10);
  display: grid;
  place-items: center;
  background: var(--c-paper);
  color: var(--c-ink);
  border-radius: 6px;
}
.ft-icon svg { width: 70%; height: 70%; }
.ft-text { display: grid; gap: calc(var(--u) * 0.8); }
.ft-text strong { font: 800 calc(var(--u) * 5.4) / 1 var(--f-display); }
.ft-text span { font: 500 max(14px, calc(var(--u) * 3.9)) / 1.25 var(--f-ui); }

/* Initials entry. */
.initials {
  display: grid;
  gap: calc(var(--u) * 2.4);
  padding: calc(var(--u) * 3);
  border: 2px solid var(--c-ink);
  border-radius: 8px;
}
.initials-heading { margin: 0; font: 800 calc(var(--u) * 5) / 1.1 var(--f-display); }
.initials-slots {
  display: flex;
  justify-content: center;
  gap: calc(var(--u) * 4);
  margin: 0;
  padding: 0;
  border: 0;
}
.slot { display: grid; justify-items: center; gap: 2px; }
.slot-btn, .slot-letter {
  width: 48px;
  min-height: 44px;
  display: grid;
  place-items: center;
  background: transparent;
  border: 0;
  color: var(--c-ink);
  cursor: pointer;
  border-radius: 6px;
}
.slot-btn svg { width: 22px; height: 22px; fill: none; stroke: var(--c-ink); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.slot-letter {
  height: 56px;
  font: 800 34px / 1 var(--f-mono);
  background: var(--c-paper-dark);
  border: 2px solid var(--c-ink);
}
.slot-btn:focus-visible, .slot-letter:focus-visible, .recap-link:focus-visible, .btn-icon:focus-visible {
  outline: 3px solid var(--c-brand);
  outline-offset: 2px;
}

/* Features you used. */
.recap { display: grid; gap: calc(var(--u) * 2.5); padding-top: calc(var(--u) * 2); }
.recap-heading { margin: 0; font: 800 calc(var(--u) * 5.4) / 1.1 var(--f-display); }
.recap-list { list-style: none; margin: 0; padding: 0; display: grid; gap: calc(var(--u) * 3); }
.recap-item { display: grid; grid-template-columns: auto 1fr; gap: calc(var(--u) * 3); align-items: start; }
.recap-icon {
  width: calc(var(--u) * 10);
  height: calc(var(--u) * 10);
  display: grid;
  place-items: center;
  background: var(--c-brand);
  color: var(--c-paper);
  border: 2px solid var(--c-ink);
  border-radius: 6px;
}
.recap-icon svg { width: 66%; height: 66%; }
.recap-body { display: grid; gap: calc(var(--u) * 1); }
.recap-name { font: 800 calc(var(--u) * 4.6) / 1.1 var(--f-display); }
.recap-desc { margin: 0; font: 400 max(15px, calc(var(--u) * 4)) / 1.35 var(--f-ui); }
.recap-link {
  justify-self: start;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  font: 700 max(15px, calc(var(--u) * 4)) / 1 var(--f-ui);
  color: var(--c-brand);
  text-underline-offset: 3px;
}
.recap-empty { margin: 0; font: 400 max(15px, calc(var(--u) * 4)) / 1.35 var(--f-ui); color: var(--c-ink-soft); }

/* Leaderboard. */
.board-list { list-style: none; margin: 0; padding: 0; display: grid; }
.board-row {
  display: grid;
  grid-template-columns: calc(var(--u) * 8) 1fr auto calc(var(--u) * 14);
  align-items: baseline;
  gap: calc(var(--u) * 2);
  padding: calc(var(--u) * 1.8) calc(var(--u) * 1);
  border-bottom: 2px solid var(--c-paper-dark);
}
.board-row.is-new { background: var(--c-paper-dark); border-left: 4px solid var(--c-brand); }
.board-rank { font: 600 calc(var(--u) * 4) / 1 var(--f-mono); color: var(--c-ink-soft); }
.board-initials { font: 800 calc(var(--u) * 6) / 1 var(--f-mono); letter-spacing: 0.08em; }
.board-items { font: 600 calc(var(--u) * 3.4) / 1 var(--f-mono); color: var(--c-ink-soft); }
.board-score { font: 800 calc(var(--u) * 7) / 1 var(--f-display); text-align: right; font-variant-numeric: tabular-nums; }
.board-empty { margin: 0; font: 400 max(15px, calc(var(--u) * 4.2)) / 1.4 var(--f-ui); }

.over-stats { flex-wrap: wrap; }

/* Daily challenge. */
.over-mode {
  margin: 0;
  justify-self: start;
  align-self: flex-start;
  padding: calc(var(--u) * 1.2) calc(var(--u) * 2.6);
  background: var(--c-highlighter);
  border: 2px solid var(--c-ink);
  border-radius: 4px;
  font: 600 calc(var(--u) * 3.4) / 1 var(--f-mono);
}
.over-wallet, .share-msg, .optin-msg, .admin-msg, .admin-note {
  margin: 0;
  font: 400 max(14px, calc(var(--u) * 3.8)) / 1.35 var(--f-ui);
  color: var(--c-ink-soft);
}
.share { display: grid; gap: calc(var(--u) * 2); }
.share-text {
  margin: 0;
  padding: calc(var(--u) * 2.4) calc(var(--u) * 3);
  background: var(--c-paper-dark);
  border-left: 4px solid var(--c-brand);
  font: 600 max(13px, calc(var(--u) * 3.5)) / 1.4 var(--f-mono);
  user-select: all;
  -webkit-user-select: all;
}
.share-msg:empty, .optin-msg:empty, .admin-msg:empty { display: none; }

/* Outfits. */
.wallet {
  display: flex;
  align-items: center;
  gap: calc(var(--u) * 2);
  margin: 0;
  font: 600 calc(var(--u) * 3.8) / 1 var(--f-mono);
}
.wallet .hud-check { width: calc(var(--u) * 6); height: calc(var(--u) * 6); }
.wallet-num { font: 800 calc(var(--u) * 7) / 1 var(--f-display); font-variant-numeric: tabular-nums; }
.outfit-list { list-style: none; margin: 0; padding: 0; display: grid; }
.outfit {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: calc(var(--u) * 3);
  padding: calc(var(--u) * 2) 0 calc(var(--u) * 2) calc(var(--u) * 2);
  border-bottom: 2px solid var(--c-paper-dark);
  border-left: 4px solid transparent;
}
.outfit.is-wearing { border-left-color: var(--c-brand); }
.outfit-preview {
  width: calc(var(--u) * 15);
  height: calc(var(--u) * 15);
  background: var(--c-paper-dark);
  border: 2px solid var(--c-ink);
  border-radius: 6px;
}
.outfit-text { display: grid; gap: calc(var(--u) * 0.8); }
.outfit-name { font: 800 calc(var(--u) * 4.8) / 1.1 var(--f-display); }
.outfit-line { margin: 0; font: 400 max(14px, calc(var(--u) * 3.6)) / 1.3 var(--f-ui); color: var(--c-ink-soft); }
.outfit .btn { min-width: calc(var(--u) * 24); padding: 0 calc(var(--u) * 2.5); font-size: max(15px, calc(var(--u) * 3.8)); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: 0.55; cursor: default; box-shadow: none; transform: translateY(var(--edge)); }
.btn-wearing { background: var(--c-paper-dark); }

/* Booth sign-up. */
.optin {
  display: grid;
  gap: calc(var(--u) * 2.4);
  padding: calc(var(--u) * 3);
  border: 2px solid var(--c-ink);
  border-radius: 6px;
}
.optin-heading { margin: 0; font: 800 calc(var(--u) * 5) / 1.1 var(--f-display); }
.optin-field { display: grid; gap: calc(var(--u) * 1); font: 600 calc(var(--u) * 3.4) / 1 var(--f-mono); }
.optin-field input {
  min-height: 48px;
  padding: 0 calc(var(--u) * 3);
  font: 400 max(16px, calc(var(--u) * 4.4)) / 1 var(--f-ui);
  color: var(--c-ink);
  background: var(--c-paper);
  border: 2px solid var(--c-ink);
  border-radius: 6px;
}
.optin-check {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: calc(var(--u) * 2.4);
  align-items: start;
  min-height: 48px;
  font: 400 max(14px, calc(var(--u) * 3.8)) / 1.35 var(--f-ui);
  cursor: pointer;
}
.optin-check input { width: 28px; height: 28px; margin: 0; accent-color: var(--c-brand); }
.optin-field input:focus-visible, .optin-check input:focus-visible {
  outline: 3px solid var(--c-brand);
  outline-offset: 2px;
}

/* Booth admin. */
.admin-count { margin: 0; font: 600 calc(var(--u) * 4.2) / 1.2 var(--f-mono); }

@media (prefers-reduced-motion: reduce) {
  .btn, .toast, .feature-toast { transition: none; }
}

/* Keep the debug panel out of the way of menus. */
.stage:has(.screen:not([hidden])) .debug { display: none; }

</style>
</head>
<body>
<div id="stage" class="stage">
  <canvas id="game" aria-label="Otter Crossing game"></canvas>

  <div id="hud" class="hud" hidden>
    <div class="hud-score"><span id="hud-lanes" class="hud-num">0</span><span class="hud-label" data-copy="game.lanes"></span></div>
    <div class="hud-items" aria-live="off">
      <svg class="hud-check" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="2" width="16" height="16" rx="3"/><path d="M6 10.5l3 3 5-7"/></svg>
      <span id="hud-items" class="hud-num">0</span>
      <span class="sr-only" data-copy="game.actionItems"></span>
    </div>
    <div id="hud-powers" class="hud-powers" role="group" data-copy-label="game.powerTracker"></div>
    <button id="btn-pause" class="hud-pause" type="button" data-copy-label="game.pause">
      <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="4" width="3.5" height="12" rx="1"/><rect x="11.5" y="4" width="3.5" height="12" rx="1"/></svg>
    </button>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="feature-toast" class="feature-toast" role="status" aria-live="polite">
    <span id="ft-icon" class="ft-icon"></span>
    <span class="ft-text"><strong id="ft-name"></strong><span id="ft-tagline"></span></span>
  </div>

  <section id="screen-title" class="screen screen-title" hidden>
    <div class="logo-slot" role="img" aria-label="Otter logo" data-copy-label="game.logoAlt"><!-- Otter logo mark from the otter.ai site header. REVIEW: confirm with brand. --><svg aria-hidden="true" focusable="false" viewBox="0 0 57 22" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M36.1707 0.304565C34.6356 0.304565 33.3867 1.55337 33.3867 3.08845V18.7112C33.3867 20.2463 34.6356 21.4951 36.1707 21.4951C37.7058 21.4951 38.9546 20.2463 38.9546 18.7112V3.08845C38.9546 1.55337 37.7058 0.304565 36.1707 0.304565Z" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M30.3725 3.08857C30.3725 1.55349 29.1237 0.304688 27.5886 0.304688C26.0535 0.304688 24.8047 1.55349 24.8047 3.08857V18.7113C24.8047 20.2464 26.0535 21.4952 27.5886 21.4952C29.1237 21.4952 30.3725 20.2464 30.3725 18.7113V3.08857Z" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M44.7468 7.35156C43.2117 7.35156 41.9629 8.60037 41.9629 10.1354V11.9747C41.9629 13.5098 43.2117 14.7586 44.7468 14.7586C46.2819 14.7586 47.5307 13.5098 47.5307 11.9747V10.1354C47.5307 8.60037 46.2819 7.35156 44.7468 7.35156Z" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M53.323 4.28906C51.7879 4.28906 50.5391 5.53787 50.5391 7.07295V14.7305C50.5391 16.2655 51.7879 17.5144 53.323 17.5144C54.8581 17.5144 56.1069 16.2655 56.1069 14.7305V7.07295C56.1069 5.53787 54.8581 4.28906 53.323 4.28906Z" fill="currentColor"/><path d="M10.8996 0C4.88799 0 0 4.8915 0 10.8994C0 16.9073 4.89156 21.7989 10.8996 21.7989C16.9075 21.7989 21.7991 16.9073 21.7991 10.8994C21.7991 4.8915 16.9075 0 10.8996 0ZM10.9103 16.4887C7.78999 16.4887 5.24938 13.9481 5.24938 10.8279C5.24938 7.7076 7.78999 5.16702 10.9103 5.16702C14.0306 5.16702 16.5712 7.7076 16.5712 10.8279C16.5712 13.9481 14.0306 16.4887 10.9103 16.4887Z" fill="currentColor"/></svg></div>
    <div class="sign">
      <h1 class="sign-plate"><span data-copy="game.title"></span></h1>
      <p class="sign-tag" data-copy="game.signTag"></p>
      <div class="sign-posts" aria-hidden="true"><span></span><span></span></div>
    </div>
    <div class="drawer">
      <button id="btn-play" class="btn btn-primary" type="button" data-copy="game.play"></button>
      <div id="title-modes" class="btn-row btn-row-3">
        <button id="btn-daily" class="btn" type="button" data-copy="game.daily"></button>
        <button id="btn-outfits" class="btn" type="button" data-copy="game.outfits"></button>
        <button class="btn btn-icon btn-mute" type="button" aria-pressed="false" data-copy-label="game.sound">
          <svg class="icon-sound" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/><path class="cross" d="M16 9l5 6M21 9l-5 6"/></svg>
        </button>
      </div>
      <div class="btn-row btn-row-3">
        <button id="btn-howto" class="btn" type="button" data-copy="game.howTo"></button>
        <button id="btn-board" class="btn" type="button" data-copy="game.leaderboard"></button>

          <svg class="icon-music" viewBox="0 0 24 24" aria-hidden="true"><path class="stem" d="M9 17V5l10-2v12"/><circle class="head" cx="6.5" cy="17" r="2.5"/><circle class="head" cx="16.5" cy="15" r="2.5"/><path class="slash" d="M3 3l18 18"/></svg>
        </button>
      </div>
    </div>
  </section>

  <section id="screen-board" class="screen" hidden>
    <div class="drawer drawer-tall">
      <h2 class="drawer-heading" data-copy="game.leaderboardHeading"></h2>
      <ol id="board-list" class="board-list"></ol>
      <p id="board-empty" class="board-empty" data-copy="game.noScores" hidden></p>
      <button id="btn-board-back" class="btn btn-primary" type="button" data-copy="game.back"></button>
    </div>
  </section>

  <section id="screen-outfits" class="screen" hidden>
    <div class="drawer drawer-full">
      <h2 class="drawer-heading" data-copy="outfits.heading"></h2>
      <p class="wallet"><svg class="hud-check" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="2" width="16" height="16" rx="3"/><path d="M6 10.5l3 3 5-7"/></svg><span id="wallet-num" class="wallet-num">0</span><span data-copy="outfits.walletLabel"></span></p>
      <ul id="outfit-list" class="outfit-list"></ul>
      <button id="btn-outfits-back" class="btn btn-primary" type="button" data-copy="game.back"></button>
    </div>
  </section>

  <section id="screen-admin" class="screen" hidden>
    <div class="drawer drawer-full">
      <h2 class="drawer-heading" data-copy="admin.heading"></h2>
      <p class="admin-note" data-copy="admin.note"></p>
      <p id="admin-signups" class="admin-count"></p>
      <p id="admin-scores" class="admin-count"></p>
      <button id="btn-admin-export" class="btn" type="button" data-copy="admin.exportCsv"></button>
      <div class="btn-row">
        <button id="btn-admin-clear" class="btn" type="button" data-copy="admin.clearSignups"></button>
        <button id="btn-admin-clear-scores" class="btn" type="button" data-copy="admin.clearScores"></button>
      </div>
      <p id="admin-msg" class="admin-msg" role="status" aria-live="polite"></p>
      <button id="btn-admin-back" class="btn btn-primary" type="button" data-copy="game.back"></button>
    </div>
  </section>

  <section id="screen-howto" class="screen" hidden>
    <div class="drawer drawer-tall">
      <h2 class="drawer-heading" data-copy="howTo.heading"></h2>
      <ul id="howto-list" class="howto-list"></ul>
      <button id="btn-howto-back" class="btn btn-primary" type="button" data-copy="game.back"></button>
    </div>
  </section>

  <section id="screen-pause" class="screen" hidden>
    <div class="drawer">
      <h2 class="drawer-heading" data-copy="game.paused"></h2>
      <button id="btn-resume" class="btn btn-primary" type="button" data-copy="game.resume"></button>
      <button id="btn-restart" class="btn" type="button" data-copy="game.restart"></button>
      <div class="btn-row">
        <button class="btn btn-mute" type="button" aria-pressed="false"></button>
        <button class="btn btn-music" type="button" aria-pressed="true"></button>
      </div>
      <button id="btn-quit" class="btn btn-quiet" type="button" data-copy="game.quit"></button>
    </div>
  </section>

  <section id="screen-over" class="screen" hidden>
    <div class="drawer drawer-full">
      <p id="over-mode" class="over-mode" hidden></p>
      <h2 id="over-cause" class="over-cause"></h2>
      <p id="over-tip" class="over-tip"></p>
      <dl class="over-stats">
        <div><dt data-copy="game.score"></dt><dd id="over-score">0</dd></div>
        <div><dt id="over-best-label" data-copy="game.best"></dt><dd id="over-best">0</dd></div>
        <div><dt data-copy="game.actionItems"></dt><dd id="over-items">0</dd></div>
      </dl>
      <p id="over-newbest" class="over-newbest" data-copy="game.newBest" hidden></p>
      <p id="over-wallet" class="over-wallet"></p>

      <div id="share" class="share" hidden>
