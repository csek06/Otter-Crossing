/* Otter Crossing. Colors and type are variables so brand values can be swapped in one place. */

:root {
  /* Nine named colors. The game art reads these too. */
  --c-paper: #F3EEE4;
  --c-ink: #2A211C;
  --c-brand: #144FFF; /* the Otter logo blue, from the otter.ai media kit (blue-horizontal.svg). One blue everywhere. */
  --c-teal: #0F2F37;
  --c-highlighter: #FFE14D;
  --c-red: #E5484D;
  --c-water: #1F5FA8; /* the river */
  --c-grass: #5E9E4A; /* the daily challenge's outdoor habitat */
  --c-power: #22D35E; /* power-ups and their effects: a superhero green that stands out from the blue lanes */

  --c-paper-dark: color-mix(in srgb, var(--c-paper) 90%, var(--c-ink));
  --c-ink-soft: color-mix(in srgb, var(--c-ink) 70%, var(--c-paper));

  --f-display: "Overpass", system-ui, sans-serif;
  --f-mono: "Overpass Mono", ui-monospace, Menlo, Consolas, monospace;
  --f-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --stage-w: 360px;
  --u: calc(var(--stage-w) / 100); /* 1% of stage width */
  --edge: 3px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--c-ink);
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

body {
  display: grid;
  place-items: center;
  font-family: var(--f-ui);
  color: var(--c-ink);
}

.stage {
  position: relative;
  overflow: hidden;
  background: var(--c-ink);
}

canvas {
  display: block;
  touch-action: none;
}

[hidden] { display: none !important; }

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* Buttons: flat paper plates with a hard ink edge, like the blocks in the game. */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  min-width: 48px;
  padding: 0 calc(var(--u) * 4);
  font: 700 max(16px, calc(var(--u) * 4.6)) / 1 var(--f-ui);
  color: var(--c-ink);
  background: var(--c-paper);
  border: 2px solid var(--c-ink);
  border-radius: 6px;
  box-shadow: 0 var(--edge) 0 var(--c-ink);
  text-decoration: none;
  cursor: pointer;
  transition: transform 60ms ease-out, box-shadow 60ms ease-out;
}
.btn:active {
  transform: translateY(var(--edge));
  box-shadow: 0 0 0 var(--c-ink);
}
.btn:focus-visible,
.hud-pause:focus-visible,
.debug input:focus-visible {
  outline: 3px solid var(--c-brand);
  outline-offset: 3px;
}
.btn-primary {
  background: var(--c-brand);
  color: var(--c-paper);
  font-family: var(--f-display);
  font-weight: 800;
  font-size: max(20px, calc(var(--u) * 6));
  min-height: max(56px, calc(var(--u) * 15));
}
.btn-quiet {
  background: transparent;
  border-color: transparent;
  box-shadow: none;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.btn-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: calc(var(--u) * 3);
}

/* Screens sit over the live scene. Content lives in a paper drawer at the bottom. */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}

.drawer {
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 3.2);
  padding: calc(var(--u) * 6) calc(var(--u) * 6) calc(var(--u) * 8);
  background: var(--c-paper);
  border-top: 3px solid var(--c-ink);
}

/* Wide screens: the drawer sits over the playfield instead of spanning the window. */
.stage.wide .drawer {
  align-self: center;
  width: min(100%, calc(var(--stage-w) * 1.18));
  border: 3px solid var(--c-ink);
  border-bottom: 0;
  border-radius: 12px 12px 0 0;
}

.drawer-heading {
  margin: 0;
  font: 800 calc(var(--u) * 8) / 1.05 var(--f-display);
}

/* Title: a road sign on two posts. */
.screen-title {
  justify-content: space-between;
}
.logo-slot {
  align-self: center;
  margin-top: calc(var(--u) * 8);
  width: calc(var(--u) * 34);
  height: calc(var(--u) * 10);
  border: 2px dashed var(--c-paper-dark);
  border-radius: 4px;
  opacity: 0.6;
}
/* With a logo in it, the slot becomes a small paper plaque so it reads over the scene. */
.logo-slot:not(:empty) {
  width: auto;
  height: auto;
  padding: calc(var(--u) * 2.4) calc(var(--u) * 4.5);
  background: var(--c-paper);
  border: 3px solid var(--c-ink);
  border-radius: 6px;
  opacity: 1;
}
.logo-slot svg { display: block; width: calc(var(--u) * 20); height: auto; color: var(--c-brand); }

.sign {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.sign-plate {
  margin: 0;
  padding: calc(var(--u) * 4) calc(var(--u) * 7) calc(var(--u) * 3);
  background: var(--c-brand);
  color: var(--c-paper);
  border: 3px solid var(--c-ink);
  border-radius: 10px;
  box-shadow: inset 0 0 0 calc(var(--u) * 1.2) var(--c-brand), inset 0 0 0 calc(var(--u) * 1.8) var(--c-paper);
  font: 800 calc(var(--u) * 12.5) / 0.95 var(--f-display);
  letter-spacing: -0.01em;
  text-align: center;
  max-width: calc(var(--u) * 86);
}
.sign-tag {
  margin: calc(var(--u) * -0.6) 0 0;
  padding: calc(var(--u) * 1.4) calc(var(--u) * 4) calc(var(--u) * 1);
  background: var(--c-paper);
  color: var(--c-ink);
  border: 3px solid var(--c-ink);
  border-radius: 6px;
  font: 600 calc(var(--u) * 3.8) / 1.2 var(--f-mono);
}
.sign-posts {
  display: flex;
  gap: calc(var(--u) * 30);
  height: calc(var(--u) * 12);
}
.sign-posts span {
  width: calc(var(--u) * 2.4);
  background: var(--c-ink-soft);
  border: 2px solid var(--c-ink);
  border-top: 0;
}

/* HUD */
.hud {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: space-between;
  gap: calc(var(--u) * 2);
  padding: calc(var(--u) * 3) calc(var(--u) * 3);
  pointer-events: none;
}
.hud > * { pointer-events: auto; }
.hud-score, .hud-items {
  display: flex;
  align-items: baseline;
  gap: calc(var(--u) * 1.5);
  padding: calc(var(--u) * 1.2) calc(var(--u) * 3) calc(var(--u) * 0.6);
  background: var(--c-paper);
  border: 2px solid var(--c-ink);
  border-radius: 6px;
}
.hud-num {
  font: 800 calc(var(--u) * 7) / 1 var(--f-display);
  font-variant-numeric: tabular-nums;
}
.hud-label {
  font: 600 calc(var(--u) * 3.4) / 1 var(--f-mono);
  color: var(--c-ink-soft);
}
.hud-items { align-items: center; margin-right: auto; }
.hud-check {
  width: calc(var(--u) * 5);
  height: calc(var(--u) * 5);
  fill: none;
  stroke: var(--c-ink);
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.hud-check path { stroke: var(--c-brand); stroke-width: 2.6; }
.hud-pause {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  background: var(--c-paper);
  border: 2px solid var(--c-ink);
  border-radius: 6px;
  cursor: pointer;
}
.hud-pause svg { width: 20px; height: 20px; fill: var(--c-ink); }

/* One-line hints. Plain ink chip, no animation beyond a fade. */
.toast {
  position: absolute;
  left: 50%;
  top: calc(var(--u) * 28);
  transform: translateX(-50%);
  width: max-content;
  max-width: calc(var(--u) * 92);
  padding: calc(var(--u) * 2.2) calc(var(--u) * 4) calc(var(--u) * 1.6);
  background: var(--c-ink);
  color: var(--c-paper);
  border-radius: 6px;
  font: 800 calc(var(--u) * 4.2) / 1.2 var(--f-display);
  text-align: center;
  text-wrap: balance;
  opacity: 0;
  transition: opacity 160ms ease-out;
  pointer-events: none;
}
.toast.show { opacity: 1; }

/* How to play */
.howto-list {
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: calc(var(--u) * 2.6);
  font: 400 max(15px, calc(var(--u) * 4.3)) / 1.4 var(--f-ui);
}
.howto-list li {
  padding-left: calc(var(--u) * 6);
  position: relative;
}
.howto-list li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0.3em;
  width: calc(var(--u) * 3);
  height: calc(var(--u) * 3);
  border: 2px solid var(--c-ink);
  border-radius: 3px;
}

/* Game over */
.over-cause {
  margin: 0;
  font: 800 calc(var(--u) * 9) / 1 var(--f-display);
}
.over-tip {
  margin: 0;
  font: 400 max(16px, calc(var(--u) * 4.6)) / 1.4 var(--f-ui);
}
.over-stats {
  display: flex;
  gap: calc(var(--u) * 8);
  margin: calc(var(--u) * 1) 0 0;
  padding-top: calc(var(--u) * 3);
  border-top: 2px solid var(--c-paper-dark);
}
.over-stats dt {
  font: 600 calc(var(--u) * 3.4) / 1 var(--f-mono);
  color: var(--c-ink-soft);
}
.over-stats dd {
  margin: calc(var(--u) * 1) 0 0;
  font: 800 calc(var(--u) * 10) / 1 var(--f-display);
  font-variant-numeric: tabular-nums;
}
.recap-count {
  display: inline-block;
  margin-left: 0.3em;
  padding: 0.1em 0.4em 0;
  background: var(--c-ink);
  color: var(--c-highlighter);
  border-radius: 5px;
  font-variant-numeric: tabular-nums;
}
.over-newbest {
  margin: 0;
  font: 600 calc(var(--u) * 3.8) / 1 var(--f-mono);
  color: var(--c-brand);
}

/* Debug panel (?debug=1) */
.debug {
  position: absolute;
  right: 6px;
  bottom: 6px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 6px 8px;
  background: var(--c-ink);
  color: var(--c-paper);
  font: 12px var(--f-mono);
  border-radius: 4px;
}
.debug label { display: flex; align-items: center; gap: 6px; min-height: 24px; }

/* Title row: two text buttons and the sound icon. */
.btn-row-3 { grid-template-columns: 1fr 1fr auto; }
.btn-icon { padding: 0; width: 52px; }
.icon-sound { width: 26px; height: 26px; fill: none; stroke: var(--c-ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-sound path:first-child { fill: var(--c-ink); }
.icon-sound .cross { display: none; }
.btn-mute.is-muted .icon-sound .wave { display: none; }
.btn-mute.is-muted .icon-sound .cross { display: inline; }
.icon-music { width: 26px; height: 26px; fill: none; stroke: var(--c-ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-music .head { fill: var(--c-ink); }
.icon-music .slash { display: none; }
.btn-music.is-off .icon-music .slash { display: inline; }
.btn-music.is-off .icon-music .stem, .btn-music.is-off .icon-music .head { opacity: 0.45; }

/* Long screens scroll inside the drawer. */
.drawer-full {
  max-height: 100%;
  overflow-y: auto;
  overscroll-behavior: contain;
  touch-action: pan-y;
  gap: calc(var(--u) * 3);
  padding-top: calc(var(--u) * 7);
}

/* HUD hawk timer: seconds until the Deadline Hawk strikes if you stop moving
   forward. It refills on every new lane, and turns red once the alarm sounds. */
.hud-hawk {
  display: flex;
  align-items: center;
  gap: calc(var(--u) * 1.4);
  padding: calc(var(--u) * 1.2) calc(var(--u) * 2.4);
  background: var(--c-paper);
  border: 2px solid var(--c-ink);
  border-radius: 6px;
}
.hud-hawk-icon {
  width: calc(var(--u) * 6);
  height: calc(var(--u) * 6);
  fill: var(--c-ink);
}
.hud-hawk-bar {
  position: relative;
  width: calc(var(--u) * 12);
  height: calc(var(--u) * 2.4);
  min-height: 8px;
  border: 2px solid var(--c-ink);
  border-radius: 99px;
  overflow: hidden;
  background: var(--c-paper-dark);
}
.hud-hawk-fill {
  position: absolute;
  inset: 0;
  transform-origin: left center;
  background: var(--c-ink);
}
.hud-hawk-num { min-width: 1ch; text-align: right; }
.hud-hawk.is-alarm { background: var(--c-red); color: var(--c-paper); }
.hud-hawk.is-alarm .hud-hawk-icon { fill: var(--c-paper); }
.hud-hawk.is-alarm .hud-hawk-fill { background: var(--c-paper); }
.hud-hawk.is-alarm .hud-hawk-bar { background: color-mix(in srgb, var(--c-red) 60%, var(--c-ink)); border-color: var(--c-paper); }

/* Wide screens: the HUD sits over the playfield, between the side panels. */
.stage.wide .hud { left: var(--side-w); right: var(--side-w); }

/* Desktop power-up panels: the space beside the playfield holds one card per
   power-up, with the same content as the first-pickup explainer. Grayed out but
   readable until found; full color and glowing while active. */
.side {
  display: none;
  position: absolute;
  top: 0;
  bottom: 0;
  width: var(--side-w);
  padding: clamp(12px, 2.2vh, 28px) clamp(12px, 1.6vw, 32px);
  flex-direction: column;
  justify-content: center;
  gap: clamp(8px, 1.6vh, 18px);
  overflow: visible;
  pointer-events: none;
  --fs: clamp(12px, 1.45vh, 16px);
}
.stage.sides.in-run .side { display: flex; }
.side.fit-1 .side-tagline { display: none; }
.side.fit-2 .side-card .learn-label { display: none; }
.side.fit-2 .side-card .learn-part { margin-top: calc(var(--fs) * 0.4); }
.side-left { left: 0; }
.side-right { right: 0; }
.side-card {
  position: relative;
  width: 100%;
  max-width: 440px;
  margin: 0 auto;
  padding: calc(var(--fs) * 0.9) calc(var(--fs) * 1.1) calc(var(--fs) * 1.1);
  background: var(--c-paper);
  color: var(--c-ink);
  border: 2px solid var(--c-ink);
  border-radius: 10px;
  box-shadow: 0 var(--edge) 0 var(--c-ink);
  font-size: var(--fs);
  overflow: hidden;
  transition: opacity 0.3s, filter 0.3s;
}
.side-head { display: flex; align-items: center; gap: calc(var(--fs) * 0.8); }
.side-icon.learn-icon { width: calc(var(--fs) * 2.8); height: calc(var(--fs) * 2.8); }
.side-titles { min-width: 0; }
.side-name { margin: 0; font: 800 calc(var(--fs) * 1.35) / 1.1 var(--f-display); }
.side-badge {
  margin: calc(var(--fs) * 0.25) 0 0;
  font: 600 calc(var(--fs) * 0.8) / 1 var(--f-mono);
  color: var(--c-ink-soft);
}
.side-tagline { margin: calc(var(--fs) * 0.6) 0 0; font: 800 var(--fs) / 1.25 var(--f-display); color: var(--c-ink-soft); }
.side-card .learn-part {
  margin-top: calc(var(--fs) * 0.6);
  padding: calc(var(--fs) * 0.5) calc(var(--fs) * 0.7) calc(var(--fs) * 0.6);
  border-left-width: calc(var(--fs) * 0.4);
}
.side-card .learn-label {
  margin: 0 0 calc(var(--fs) * 0.35);
  padding: calc(var(--fs) * 0.25) calc(var(--fs) * 0.6) calc(var(--fs) * 0.2);
  font-size: calc(var(--fs) * 0.8);
}
.side-card .learn-text { font-size: calc(var(--fs) * 0.92); line-height: 1.35; }
.side-time {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: calc(var(--fs) * 0.35);
  background: transparent;
}
.side-time-fill {
  position: absolute;
  inset: 0;
  transform: scaleX(0);
  transform-origin: left center;
  background: var(--c-highlighter);
}
/* Pickup counter: a big count on the right of the card's head. It pops when it
   goes up (off with reduced motion). */
.side-count {
  margin: 0 0 0 auto;
  padding: calc(var(--fs) * 0.2) calc(var(--fs) * 0.55) calc(var(--fs) * 0.05);
  background: var(--c-ink);
  color: var(--c-highlighter);
  border-radius: 8px;
  font: 800 calc(var(--fs) * 1.7) / 1 var(--f-display);
  font-variant-numeric: tabular-nums;
}
.side-count.bump { animation: count-bump 0.45s ease-out; }
@keyframes count-bump {
  0% { transform: scale(1); }
  35% { transform: scale(1.45); }
  100% { transform: scale(1); }
}
/* Not found yet: gray but still readable. Once collected a card stays in full
   color for the rest of the run; only an active power-up glows. */
.side-card.is-off { filter: grayscale(1); opacity: 0.66; box-shadow: none; }
.side-card.is-held .side-badge, .side-card.is-got .side-badge, .side-card.is-used .side-badge { color: var(--c-ink); font-weight: 800; }
/* Active: scaled up, green frame, a tinted face and a strong glow that
   breathes every 1.2 seconds (well under 3 flashes a second). */
.side-card.is-active {
  z-index: 1;
  transform: scale(1.04);
  border: 3px solid var(--c-power);
  background: color-mix(in srgb, var(--c-power) 10%, var(--c-paper));
  box-shadow: 0 0 0 4px var(--c-highlighter), 0 0 30px 10px color-mix(in srgb, var(--c-power) 80%, transparent);
  animation: side-glow 1.2s ease-in-out infinite;
}
.side-card.is-active .side-badge { color: var(--c-power); font-weight: 800; }
.side-card.is-active .side-icon { box-shadow: 0 0 14px 4px color-mix(in srgb, var(--c-highlighter) 80%, transparent); }
@keyframes side-glow {
  0%, 100% { box-shadow: 0 0 0 4px var(--c-highlighter), 0 0 22px 6px color-mix(in srgb, var(--c-power) 65%, transparent); }
  50% { box-shadow: 0 0 0 4px var(--c-highlighter), 0 0 48px 18px color-mix(in srgb, var(--c-power) 95%, transparent); }
}

/* HUD power-up tracker: a second row under the score with one slot per power-up
   this run can spawn. Faded and dashed until found, a draining ring while active,
   a full ink ring while held, crossed out once a once-a-run power-up is spent. */
.hud-powers {
  order: 2;
  flex: 1 0 100%;
  display: flex;
  gap: calc(var(--u) * 1.6);
}
.hud-power {
  position: relative;
  width: calc(var(--u) * 9);
  height: calc(var(--u) * 9);
  min-width: 32px;
  min-height: 32px;
  display: grid;
  place-items: center;
  background: var(--c-paper);
  border: 2px solid var(--c-ink);
  border-radius: 50%;
}
.hud-power .ring { position: absolute; inset: -2px; width: calc(100% + 4px); height: calc(100% + 4px); transform: rotate(-90deg); }
.hud-power .ring-bg { fill: none; stroke: var(--c-paper-dark); stroke-width: 4; }
.hud-power .ring-fg { fill: none; stroke: var(--c-power); stroke-width: 4; stroke-linecap: round; }
.hud-power.is-got .ring { display: none; }
.hud-power.is-off, .hud-power.is-used { border-style: dashed; border-color: var(--c-ink-soft); }
.hud-power.is-off .ring, .hud-power.is-used .ring { display: none; }
.hud-power.is-off .hud-power-icon { color: var(--c-ink-soft); opacity: 0.6; }
.hud-power.is-used .hud-power-icon { color: var(--c-ink-soft); opacity: 0.35; }
.hud-power.is-used::after {
  content: '';
  position: absolute;
  left: 12%; right: 12%; top: 50%;
  height: 2px;
  background: var(--c-ink-soft);
  transform: rotate(-45deg);
}
/* Active: filled with brand blue, a size up, and a soft glow that breathes once
   every 1.6 seconds (well under 3 flashes a second). Held: the same glow, still.
   Power-ups are green everywhere in play, so they stand out from the blue lanes. */
.hud-power.is-active, .hud-power.is-held {
  transform: scale(1.18);
  z-index: 1;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-power) 35%, transparent),
              0 0 14px 4px color-mix(in srgb, var(--c-power) 55%, transparent);
}
.hud-power.is-active { background: var(--c-power); animation: power-glow 1.6s ease-in-out infinite; }
.hud-power.is-active .hud-power-icon { color: var(--c-ink); }
.hud-power.is-active .ring-bg { stroke: color-mix(in srgb, var(--c-power) 55%, var(--c-ink)); }
.hud-power.is-active .ring-fg { stroke: var(--c-ink); }
.hud-power.is-held { background: var(--c-paper); }
.hud-power.is-held .ring-fg { stroke: var(--c-power); }
.hud-power.is-held .hud-power-icon { color: var(--c-power); }
@keyframes power-glow {
  0%, 100% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-power) 35%, transparent),
                         0 0 10px 2px color-mix(in srgb, var(--c-power) 45%, transparent); }
  50%      { box-shadow: 0 0 0 4px color-mix(in srgb, var(--c-power) 45%, transparent),
                         0 0 22px 8px color-mix(in srgb, var(--c-power) 70%, transparent); }
}
.hud-power-icon, .recap-icon svg, .ft-icon svg {
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.hud-power-icon { position: relative; width: 55%; height: 55%; color: var(--c-ink); }

/* First-pickup explainer. Centered over the frozen game. It takes no pointer
   input, so a tap lands on the canvas as a hop forward, which closes it. */
.learn {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: calc(var(--u) * 6);
  background: color-mix(in srgb, var(--c-ink) 45%, transparent);
  pointer-events: none;
  z-index: 5;
}
.learn[hidden] { display: none; }
.learn-card {
  width: 100%;
  max-width: calc(var(--u) * 86);
  padding: calc(var(--u) * 5) calc(var(--u) * 6) calc(var(--u) * 5);
  background: var(--c-paper);
  color: var(--c-ink);
  border: 2px solid var(--c-ink);
  border-radius: 10px;
  box-shadow: 0 var(--edge) 0 var(--c-ink);
}
.learn-kicker {
  margin: 0 0 calc(var(--u) * 2);
  font: 600 max(13px, calc(var(--u) * 3.4)) / 1 var(--f-mono);
  color: var(--c-brand);
}
.learn-head { display: flex; align-items: center; gap: calc(var(--u) * 3); }
.learn-icon {
  flex: none;
  width: calc(var(--u) * 12);
  height: calc(var(--u) * 12);
  display: grid;
  place-items: center;
  background: var(--c-brand);
  border: 2px solid var(--c-ink);
  border-radius: 8px;
  color: var(--c-paper);
}
.learn-icon svg { width: 62%; height: 62%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.learn-name { margin: 0; font: 800 max(24px, calc(var(--u) * 7)) / 1.05 var(--f-display); }
.learn-tagline { margin: calc(var(--u) * 2) 0 calc(var(--u) * 3); font: 800 max(16px, calc(var(--u) * 4.2)) / 1.25 var(--f-display); color: var(--c-ink-soft); }
/* The two halves are color coded: highlighter yellow for the game, brand blue
   for work. Each gets a filled label chip with an icon and a matching rail. */
.learn-part {
  margin-top: calc(var(--u) * 3);
  padding: calc(var(--u) * 2.4) calc(var(--u) * 3) calc(var(--u) * 2.6);
  border: 2px solid var(--c-ink);
  border-left-width: calc(var(--u) * 1.6);
  border-radius: 8px;
}
.learn-game { border-left-color: var(--c-highlighter); background: color-mix(in srgb, var(--c-highlighter) 18%, var(--c-paper)); }
.learn-work { border-left-color: var(--c-brand); background: color-mix(in srgb, var(--c-brand) 8%, var(--c-paper)); }
.learn-label {
  display: inline-flex;
  align-items: center;
  gap: calc(var(--u) * 1.4);
  margin: 0 0 calc(var(--u) * 1.6);
  padding: calc(var(--u) * 1.1) calc(var(--u) * 2.2) calc(var(--u) * 0.9);
  border: 2px solid var(--c-ink);
  border-radius: 999px;
  font: 800 max(14px, calc(var(--u) * 3.6)) / 1 var(--f-display);
}
.learn-label svg { width: 1.1em; height: 1.1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.learn-game .learn-label { background: var(--c-highlighter); color: var(--c-ink); }
/* Inside Otter: paper chip so the logo can stay blue. */
.learn-work .learn-label { background: var(--c-paper); color: var(--c-brand); border-color: var(--c-brand); }
.learn-logo { display: inline-flex; }
.learn-logo svg { width: 2.6em; height: 1em; color: var(--c-brand); }
.learn-text { margin: 0; font: 400 max(16px, calc(var(--u) * 4.2)) / 1.4 var(--f-ui); text-wrap: pretty; }
.learn-go {
  display: flex;
  align-items: center;
  gap: calc(var(--u) * 2);
  margin: calc(var(--u) * 5) 0 0;
  padding: calc(var(--u) * 2.4) calc(var(--u) * 3);
  background: var(--c-ink);
  color: var(--c-paper);
  border-radius: 6px;
  font: 800 max(15px, calc(var(--u) * 3.8)) / 1.2 var(--f-display);
}
.learn-go svg { flex: none; width: calc(var(--u) * 5); height: calc(var(--u) * 5); fill: none; stroke: var(--c-highlighter); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

/* Feature card on pickup: sits low so the lanes ahead stay clear. */
.feature-toast {
  position: absolute;
  left: 50%;
  bottom: calc(var(--u) * 5);
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: calc(var(--u) * 3);
  width: max-content;
  max-width: calc(var(--u) * 92);
  padding: calc(var(--u) * 2.6) calc(var(--u) * 4) calc(var(--u) * 2.6) calc(var(--u) * 3);
  background: var(--c-brand);
  color: var(--c-paper);
  border: 2px solid var(--c-ink);
  border-radius: 8px;
  box-shadow: 0 var(--edge) 0 var(--c-ink);
  opacity: 0;
  transition: opacity 140ms ease-out;
  pointer-events: none;
}
.feature-toast.show { opacity: 1; }
.ft-icon {
  flex: none;
  width: calc(var(--u) * 10);
  height: calc(var(--u) * 10);
  display: grid;
  place-items: center;
  background: var(--c-paper);
  color: var(--c-ink);
  border-radius: 6px;
}
.ft-icon svg { width: 70%; height: 70%; }
.ft-text { display: grid; gap: calc(var(--u) * 0.8); }
.ft-text strong { font: 800 calc(var(--u) * 5.4) / 1 var(--f-display); }
.ft-text span { font: 500 max(14px, calc(var(--u) * 3.9)) / 1.25 var(--f-ui); }

/* Initials entry. */
.initials {
  display: grid;
  gap: calc(var(--u) * 2.4);
  padding: calc(var(--u) * 3);
  border: 2px solid var(--c-ink);
  border-radius: 8px;
}
.initials-heading { margin: 0; font: 800 calc(var(--u) * 5) / 1.1 var(--f-display); }
.initials-slots {
  display: flex;
  justify-content: center;
  gap: calc(var(--u) * 4);
  margin: 0;
  padding: 0;
  border: 0;
}
.slot { display: grid; justify-items: center; gap: 2px; }
.slot-btn, .slot-letter {
  width: 48px;
  min-height: 44px;
  display: grid;
  place-items: center;
  background: transparent;
  border: 0;
  color: var(--c-ink);
  cursor: pointer;
  border-radius: 6px;
}
.slot-btn svg { width: 22px; height: 22px; fill: none; stroke: var(--c-ink); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.slot-letter {
  height: 56px;
  font: 800 34px / 1 var(--f-mono);
  background: var(--c-paper-dark);
  border: 2px solid var(--c-ink);
}
.slot-btn:focus-visible, .slot-letter:focus-visible, .recap-link:focus-visible, .btn-icon:focus-visible {
  outline: 3px solid var(--c-brand);
  outline-offset: 2px;
}

/* Features you used. */
.recap { display: grid; gap: calc(var(--u) * 2.5); padding-top: calc(var(--u) * 2); }
.recap-heading { margin: 0; font: 800 calc(var(--u) * 5.4) / 1.1 var(--f-display); }
.recap-list { list-style: none; margin: 0; padding: 0; display: grid; gap: calc(var(--u) * 3); }
.recap-item { display: grid; grid-template-columns: auto 1fr; gap: calc(var(--u) * 3); align-items: start; }
.recap-icon {
  width: calc(var(--u) * 10);
  height: calc(var(--u) * 10);
  display: grid;
  place-items: center;
  background: var(--c-brand);
  color: var(--c-paper);
  border: 2px solid var(--c-ink);
  border-radius: 6px;
}
.recap-icon svg { width: 66%; height: 66%; }
.recap-body { display: grid; gap: calc(var(--u) * 1); }
.recap-name { font: 800 calc(var(--u) * 4.6) / 1.1 var(--f-display); }
.recap-desc { margin: 0; font: 400 max(15px, calc(var(--u) * 4)) / 1.35 var(--f-ui); }
.recap-link {
  justify-self: start;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  font: 700 max(15px, calc(var(--u) * 4)) / 1 var(--f-ui);
  color: var(--c-brand);
  text-underline-offset: 3px;
}
.recap-empty { margin: 0; font: 400 max(15px, calc(var(--u) * 4)) / 1.35 var(--f-ui); color: var(--c-ink-soft); }

/* Leaderboard. */
.board-list { list-style: none; margin: 0; padding: 0; display: grid; }
.board-row {
  display: grid;
  grid-template-columns: calc(var(--u) * 8) 1fr auto calc(var(--u) * 14);
  align-items: baseline;
  gap: calc(var(--u) * 2);
  padding: calc(var(--u) * 1.8) calc(var(--u) * 1);
  border-bottom: 2px solid var(--c-paper-dark);
}
.board-row.is-new { background: var(--c-paper-dark); border-left: 4px solid var(--c-brand); }
.board-rank { font: 600 calc(var(--u) * 4) / 1 var(--f-mono); color: var(--c-ink-soft); }
.board-initials { font: 800 calc(var(--u) * 6) / 1 var(--f-mono); letter-spacing: 0.08em; }
.board-items { font: 600 calc(var(--u) * 3.4) / 1 var(--f-mono); color: var(--c-ink-soft); }
.board-score { font: 800 calc(var(--u) * 7) / 1 var(--f-display); text-align: right; font-variant-numeric: tabular-nums; }
.board-empty { margin: 0; font: 400 max(15px, calc(var(--u) * 4.2)) / 1.4 var(--f-ui); }

.over-stats { flex-wrap: wrap; }

/* Daily challenge. */
.over-mode {
  margin: 0;
  justify-self: start;
  align-self: flex-start;
  padding: calc(var(--u) * 1.2) calc(var(--u) * 2.6);
  background: var(--c-highlighter);
  border: 2px solid var(--c-ink);
  border-radius: 4px;
  font: 600 calc(var(--u) * 3.4) / 1 var(--f-mono);
}
.over-wallet, .share-msg, .optin-msg, .admin-msg, .admin-note {
  margin: 0;
  font: 400 max(14px, calc(var(--u) * 3.8)) / 1.35 var(--f-ui);
  color: var(--c-ink-soft);
}
.share { display: grid; gap: calc(var(--u) * 2); }
.share-text {
  margin: 0;
  padding: calc(var(--u) * 2.4) calc(var(--u) * 3);
  background: var(--c-paper-dark);
  border-left: 4px solid var(--c-brand);
  font: 600 max(13px, calc(var(--u) * 3.5)) / 1.4 var(--f-mono);
  user-select: all;
  -webkit-user-select: all;
}
.share-msg:empty, .optin-msg:empty, .admin-msg:empty { display: none; }

/* Outfits. */
.wallet {
  display: flex;
  align-items: center;
  gap: calc(var(--u) * 2);
  margin: 0;
  font: 600 calc(var(--u) * 3.8) / 1 var(--f-mono);
}
.wallet .hud-check { width: calc(var(--u) * 6); height: calc(var(--u) * 6); }
.wallet-num { font: 800 calc(var(--u) * 7) / 1 var(--f-display); font-variant-numeric: tabular-nums; }
.outfit-list { list-style: none; margin: 0; padding: 0; display: grid; }
.outfit {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: calc(var(--u) * 3);
  padding: calc(var(--u) * 2) 0 calc(var(--u) * 2) calc(var(--u) * 2);
  border-bottom: 2px solid var(--c-paper-dark);
  border-left: 4px solid transparent;
}
.outfit.is-wearing { border-left-color: var(--c-brand); }
.outfit-preview {
  width: calc(var(--u) * 15);
  height: calc(var(--u) * 15);
  background: var(--c-paper-dark);
  border: 2px solid var(--c-ink);
  border-radius: 6px;
}
.outfit-text { display: grid; gap: calc(var(--u) * 0.8); }
.outfit-tag {
  justify-self: start;
  padding: 2px calc(var(--u) * 1.6);
  border-radius: 999px;
  background: var(--c-ink);
  color: var(--c-paper);
  font: 700 max(12px, calc(var(--u) * 2.8)) / 1.3 var(--f-ui);
}
.outfit-name { font: 800 calc(var(--u) * 4.8) / 1.1 var(--f-display); }
.outfit-line { margin: 0; font: 400 max(14px, calc(var(--u) * 3.6)) / 1.3 var(--f-ui); color: var(--c-ink-soft); }
.outfit .btn { min-width: calc(var(--u) * 24); padding: 0 calc(var(--u) * 2.5); font-size: max(15px, calc(var(--u) * 3.8)); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: 0.55; cursor: default; box-shadow: none; transform: translateY(var(--edge)); }
.btn-wearing { background: var(--c-paper-dark); }

/* Booth sign-up. */
.optin {
  display: grid;
  gap: calc(var(--u) * 2.4);
  padding: calc(var(--u) * 3);
  border: 2px solid var(--c-ink);
  border-radius: 6px;
}
.optin-heading { margin: 0; font: 800 calc(var(--u) * 5) / 1.1 var(--f-display); }
.optin-field { display: grid; gap: calc(var(--u) * 1); font: 600 calc(var(--u) * 3.4) / 1 var(--f-mono); }
.optin-field input {
  min-height: 48px;
  padding: 0 calc(var(--u) * 3);
  font: 400 max(16px, calc(var(--u) * 4.4)) / 1 var(--f-ui);
  color: var(--c-ink);
  background: var(--c-paper);
  border: 2px solid var(--c-ink);
  border-radius: 6px;
}
.optin-check {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: calc(var(--u) * 2.4);
  align-items: start;
  min-height: 48px;
  font: 400 max(14px, calc(var(--u) * 3.8)) / 1.35 var(--f-ui);
  cursor: pointer;
}
.optin-check input { width: 28px; height: 28px; margin: 0; accent-color: var(--c-brand); }
.optin-field input:focus-visible, .optin-check input:focus-visible {
  outline: 3px solid var(--c-brand);
  outline-offset: 2px;
}

/* Booth admin. */
.admin-count { margin: 0; font: 600 calc(var(--u) * 4.2) / 1.2 var(--f-mono); }

@media (prefers-reduced-motion: reduce) {
  .btn, .toast, .feature-toast { transition: none; }
  .hud-power.is-active { animation: none; }
  .side-card.is-active { animation: none; }
  .side-count.bump { animation: none; }
  .side-card { transition: none; }
}

/* Keep the debug panel out of the way of menus. */
.stage:has(.screen:not([hidden])) .debug { display: none; }

/* Online boards: tabs, status, sign-in, account, and posting on game over. */
.board-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: calc(var(--u) * 1.6);
}
.board-tab {
  min-height: 48px;
  padding: 0 calc(var(--u) * 3.4);
  font: 800 max(14px, calc(var(--u) * 3.8)) / 1 var(--f-display);
  color: var(--c-ink);
  background: var(--c-paper);
  border: 2px solid var(--c-ink);
  border-radius: 999px;
  cursor: pointer;
}
.board-tab[aria-selected="true"] { background: var(--c-brand); color: var(--c-paper); }
.board-tab:focus-visible { outline: 3px solid var(--c-brand); outline-offset: 2px; }
.board-status {
  margin: 0;
  font: 600 max(13px, calc(var(--u) * 3.4)) / 1.35 var(--f-mono);
  color: var(--c-ink-soft);
}
.board-you {
  margin-left: calc(var(--u) * 2);
  padding: 2px calc(var(--u) * 1.6);
  font: 800 max(11px, calc(var(--u) * 2.8)) / 1.2 var(--f-display);
  letter-spacing: 0;
  color: var(--c-paper);
  background: var(--c-brand);
  border-radius: 999px;
  vertical-align: middle;
}
.signin {
  display: grid;
  gap: calc(var(--u) * 2.4);
  padding: calc(var(--u) * 3);
  border: 2px solid var(--c-ink);
  border-left: calc(var(--u) * 1.6) solid var(--c-brand);
  border-radius: 8px;
  background: color-mix(in srgb, var(--c-brand) 8%, var(--c-paper));
}
.signin-intro, .board-account-text {
  margin: 0;
  font: 400 max(15px, calc(var(--u) * 4)) / 1.4 var(--f-ui);
}
.signin .optin-field input { background: var(--c-paper); }
.board-account { display: grid; gap: calc(var(--u) * 1.6); }
.post-check {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: calc(var(--u) * 2.4);
  align-items: center;
  min-height: 48px;
  font: 400 max(14px, calc(var(--u) * 3.8)) / 1.35 var(--f-ui);
  cursor: pointer;
}
.post-check[hidden] { display: none; }
.post-check input { width: 28px; height: 28px; margin: 0; accent-color: var(--c-brand); }
.post-check input:focus-visible { outline: 3px solid var(--c-brand); outline-offset: 2px; }
.post-msg {
  margin: 0;
  font: 800 max(15px, calc(var(--u) * 4)) / 1.3 var(--f-display);
  color: var(--c-brand);
}
.post-msg:empty { display: none; }
.admin-event { display: grid; gap: calc(var(--u) * 2); }
.admin-event[hidden] { display: none; }

/* Top 100: the list scrolls on its own so the tabs and Back stay in reach. */
#screen-board .board-list {
  max-height: 46vh;
  overflow-y: auto;
  overscroll-behavior: contain;
  touch-action: pan-y;
}

</style>
</head>
