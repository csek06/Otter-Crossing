# Builds the game and publishes it to GitHub Pages.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.

name: Deploy to GitHub Pages

on:
  push:
    # The default branch. Add main here if the repo moves to one.
    branches: [ccr-abd75a4b-vapjnc]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push replaces a queued one, but a running deploy finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (generator rules, copy checks, stretch goals)
        run: npm test
      - name: Build the single-file game
        run: npm run build
      - name: Stage the site
        run: |
          mkdir -p _site
          cp dist/otter-crossing.html _site/index.html
          cp dist/otter-crossing.html _site/otter-crossing.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
