# Builds the game and publishes it to GitHub Pages.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.

name: Deploy to GitHub Pages

on:
  push:
    # The default branch. Add main here if the repo moves to one.
    branches: [ccr-abd75a4b-vapjnc]
  workflow_dispatch:
  # Rebuild after the database and Auth setup run, so a new project goes live without a push.
  workflow_run:
    workflows: ['Supabase migrations']
    types: [completed]
    branches: [ccr-abd75a4b-vapjnc]

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push replaces a queued one, but a running deploy finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Database checks (migration against Postgres 16)
        run: npm run test:db
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Unit tests (generator rules, copy checks, stretch goals)
        run: npm test
      - name: Find the Supabase project
        # Uses the SUPABASE_URL and SUPABASE_ANON_KEY variables when they're set,
        # and otherwise looks both up with the access token the migrations use.
        env:
          URL_SET: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          KEY_SET: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_REF || vars.SUPABASE_PROJECT_ID || vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -n "$URL_SET" ] && [ -n "$KEY_SET" ]; then
            printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$URL_SET" "$KEY_SET" >> "$GITHUB_ENV"
            echo "Online boards: $URL_SET (from repository settings)"
          else
            node tools/supabase-keys.mjs
          fi
      - name: Build the single-file game
        run: npm run build
      - name: Stage the site
        run: |
          mkdir -p _site
          cp dist/otter-crossing.html _site/index.html
          cp dist/otter-crossing.html _site/otter-crossing.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
